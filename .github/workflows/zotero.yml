name: Zotero Slack Alert

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-zotero:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Validate required secrets
        env:
          GROUP_ID: ${{ secrets.GROUP_ID }}
          COLLECTION_KEY: ${{ secrets.COLLECTION_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          test -n "$GROUP_ID" || (echo "Missing required secret: GROUP_ID" && exit 1)
          test -n "$COLLECTION_KEY" || (echo "Missing required secret: COLLECTION_KEY" && exit 1)
          test -n "$ZOTERO_API_KEY" || (echo "Missing required secret: ZOTERO_API_KEY" && exit 1)
          test -n "$SLACK_WEBHOOK" || (echo "Missing required secret: SLACK_WEBHOOK" && exit 1)
      
      - name: Test Zotero collection
        env:
          GROUP_ID: ${{ secrets.GROUP_ID }}
          COLLECTION_KEY: ${{ secrets.COLLECTION_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: |
          echo "GROUP_ID length: ${#GROUP_ID}"
          echo "COLLECTION_KEY length: ${#COLLECTION_KEY}"
      
          echo "Testing group..."
          curl -s -o /tmp/group.json -w "Group HTTP status: %{http_code}\n" \
            -H "Zotero-API-Key: $ZOTERO_API_KEY" \
            "https://api.zotero.org/groups/$GROUP_ID/items?limit=1"
      
          echo "Testing collection..."
          curl -s -o /tmp/collection.json -w "Collection HTTP status: %{http_code}\n" \
            -H "Zotero-API-Key: $ZOTERO_API_KEY" \
            "https://api.zotero.org/groups/$GROUP_ID/collections/$COLLECTION_KEY/items?limit=1"
      
          echo "Collection response:"
          head -c 500 /tmp/collection.json
            - name: Run script
              env:
                GROUP_ID: ${{ secrets.GROUP_ID }}
                COLLECTION_KEY: ${{ secrets.COLLECTION_KEY }}
                ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
                SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
              run: python zotero_alert.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_item*.txt
          git commit -m "Update Zotero state" || echo "No changes"
          git push
