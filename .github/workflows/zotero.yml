name: Zotero Slack Alert

on:
  workflow_dispatch:

jobs:
  check-zotero:
    runs-on: ubuntu-latest

    steps:
      - name: Test Zotero collection
        env:
          GROUP_ID: ${{ secrets.GROUP_ID }}
          COLLECTION_KEY: ${{ secrets.COLLECTION_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: |
          echo "Testing collection:"
          echo "Group ID length: ${#GROUP_ID}"
          echo "Collection key length: ${#COLLECTION_KEY}"

          echo ""
          echo "=== Collection information ==="

          curl -i \
            -H "Zotero-API-Key: $ZOTERO_API_KEY" \
            "https://api.zotero.org/groups/$GROUP_ID/collections/$COLLECTION_KEY"

          echo ""
          echo "=== Collection items ==="

          curl -i \
            -H "Zotero-API-Key: $ZOTERO_API_KEY" \
            "https://api.zotero.org/groups/$GROUP_ID/collections/$COLLECTION_KEY/items?limit=20"
