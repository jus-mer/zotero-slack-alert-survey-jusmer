name: Zotero Slack Alert

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-zotero:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Validate required secrets
        env:
          GROUP_ID: ${{ secrets.GROUP_ID }}
          COLLECTION_KEY: ${{ secrets.COLLECTION_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          test -n "$GROUP_ID" || (echo "Missing required secret: GROUP_ID" && exit 1)
          test -n "$COLLECTION_KEY" || (echo "Missing required secret: COLLECTION_KEY" && exit 1)
          test -n "$ZOTERO_API_KEY" || (echo "Missing required secret: ZOTERO_API_KEY" && exit 1)
          test -n "$SLACK_WEBHOOK" || (echo "Missing required secret: SLACK_WEBHOOK" && exit 1)

      - name: Inspect script and Zotero items
        env:
          GROUP_ID: ${{ secrets.GROUP_ID }}
          COLLECTION_KEY: ${{ secrets.COLLECTION_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: |
          echo "=== Script location ==="
          pwd
          ls -l zotero_alert.py

          echo ""
          echo "=== Script beginning ==="
          head -30 zotero_alert.py

          echo ""
          echo "=== Zotero items ==="

          python - <<'PY'
          import os
          import requests

          group_id = os.environ["GROUP_ID"]
          collection_key = os.environ["COLLECTION_KEY"]
          api_key = os.environ["ZOTERO_API_KEY"]

          url = (
              f"https://api.zotero.org/groups/{group_id}/items"
              f"?sort=dateAdded&direction=desc&limit=100"
          )

          response = requests.get(
              url,
              headers={"Zotero-API-Key": api_key},
              timeout=30
          )

          print("HTTP status:", response.status_code)
          response.raise_for_status()

          items = response.json()

          print("Items returned:", len(items))
          print("Target collection:", collection_key)
          print("")

          for item in items[:20]:
              data = item.get("data", {})

              print(
                  item.get("key"),
                  "|",
                  data.get("dateAdded"),
                  "|",
                  data.get("title"),
                  "| collections:",
                  data.get("collections")
              )
          PY

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_item*.txt
          git commit -m "Update Zotero state" || echo "No changes"
          git push
